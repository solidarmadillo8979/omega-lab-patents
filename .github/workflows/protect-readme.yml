name: Protect README

on:
  pull_request:
    paths:
      - 'README.md'

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ensure README exists
        run: |
          if [ ! -f README.md ]; then
            echo "README.md was deleted. This PR is blocked."
            exit 1
          fi
      - name: Verify README integrity
        run: |
          if ! grep -q "Scientist Gem | OMEGA Protocol" README.md; then
            echo "README.md was modified incorrectly. This PR is blocked."
            exit 1
          fi
